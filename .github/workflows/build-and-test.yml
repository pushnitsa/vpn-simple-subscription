name: Build and Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VPN.SimpleSub.sln

      - name: Build solution
        run: dotnet build VPN.SimpleSub.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test VPN.SimpleSub.sln --no-build --configuration Release --verbosity normal
